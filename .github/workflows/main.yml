name: Build SHERA RUN Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Extract game project
        run: |
          mkdir -p app
          unzip -q SHERA-RUN-Android-Ready.zip -d app

      - name: Install dependencies and fix esbuild
        working-directory: app
        run: npm install --save-dev esbuild@^0.28.2

      - name: Build game
        working-directory: app
        run: npm run build

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Sync Android project
        working-directory: app
        run: npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHERA-RUN-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
