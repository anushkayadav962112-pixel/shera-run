name: Build SHERA RUN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build SHERA RUN APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract game project
      - name: Extract game project
        shell: bash
        run: |
          set -e

          if [ ! -f package.json ]; then
            if [ -f SHERA-RUN-Android-Fixed.zip ]; then
              unzip -oq SHERA-RUN-Android-Fixed.zip -d .
            elif [ -f SHERA-RUN-Android-Ready.zip ]; then
              unzip -oq SHERA-RUN-Android-Ready.zip -d .
            fi
          fi

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found in repository root."
            find . -maxdepth 4 -name package.json
            exit 1
          fi

          echo "Game project found successfully."

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Install Android SDK packages manually
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          echo "Checking Android SDK..."

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -name sdkmanager
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installation completed."

      # 6. Verify Android SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          "$SDKMANAGER" --version
          adb version

          echo "ANDROID_HOME=$ANDROID_HOME"

      # 7. Install dependencies
      - name: Install npm dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      # 8. Verify Capacitor
      - name: Verify Capacitor
        run: |
          npx cap --version

      # 9. Build web game
      - name: Build web game
        run: npm run build

      # 10. Add Android platform
      - name: Add Android platform
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # 11. Sync Android project
      - name: Sync Capacitor
        run: npx cap sync android

      # 12. Build Android APK
      - name: Build SHERA RUN APK
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 13. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated."
            find android -name "*.apk"
            exit 1
          fi

          echo "SHERA RUN APK generated successfully!"
          ls -lh "$APK"

      # 14. Upload APK
      - name: Upload SHERA RUN APK
        uses: actions/upload-artifact@v4
        with:
          name: SHERA-RUN-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
