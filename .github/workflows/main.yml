
name: Build SHERA RUN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build SHERA RUN APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract game project
      - name: Extract game project
        shell: bash
        run: |
          set -e

          if [ ! -f package.json ]; then
            if [ -f SHERA-RUN-Android-Fixed.zip ]; then
              unzip -oq SHERA-RUN-Android-Fixed.zip -d .
            elif [ -f SHERA-RUN-Android-Ready.zip ]; then
              unzip -oq SHERA-RUN-Android-Ready.zip -d .
            fi
          fi

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found."
            find . -maxdepth 5 -name package.json
            exit 1
          fi

          echo "Game project found successfully."

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Setup Java 17
      - name: Setup Java
      uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: '21'
    cache: gradle

      # 5. Prepare Android SDK paths
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

          echo "Android SDK path prepared."

      # 6. Install Android SDK packages
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -name sdkmanager
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK packages installed."

      # 7. Verify Android SDK and ADB
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Checking Android SDK..."

          ADB="$ANDROID_HOME/platform-tools/adb"

          if [ ! -f "$ADB" ]; then
            echo "ERROR: ADB executable not found."
            find "$ANDROID_HOME" -name adb
            exit 1
          fi

          chmod +x "$ADB"

          "$ADB" version

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          "$SDKMANAGER" --version

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK verification successful!"

      # 8. Install npm dependencies
      - name: Install npm dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      # 9. Verify Capacitor
      - name: Verify Capacitor
        shell: bash
        run: |
          set -e
          npx cap --version

      # 10. Build web game
      - name: Build web game
        shell: bash
        run: |
          set -e
          npm run build

          echo "Web game build completed."

      # 11. Add Android platform
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          if [ ! -d android ]; then
            npx cap add android
          fi

      # 12. Sync Capacitor
      - name: Sync Capacitor
        shell: bash
        run: |
          set -e
          npx cap sync android

      # 13. Build SHERA RUN APK
      - name: Build SHERA RUN APK
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 14. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated."
            find android -name "*.apk"
            exit 1
          fi

          echo "SHERA RUN APK generated successfully!"
          ls -lh "$APK"

      # 15. Upload APK
      - name: Upload SHERA RUN APK
        uses: actions/upload-artifact@v4
        with:
          name: SHERA-RUN-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
