name: Build SHERA RUN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SHERA RUN APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract game project
      - name: Extract uploaded game project
        shell: bash
        run: |
          set -e

          if [ ! -f package.json ]; then
            if [ -f SHERA-RUN-Android-Fixed.zip ]; then
              unzip -oq SHERA-RUN-Android-Fixed.zip -d .
            elif [ -f SHERA-RUN-Android-Ready.zip ]; then
              unzip -oq SHERA-RUN-Android-Ready.zip -d .
            fi
          fi

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found!"
            find . -maxdepth 5 -name package.json
            exit 1
          fi

          echo "Game project found."
          ls -la

      # 3. Setup Node.js
      # FIX: npm cache disabled because lock file is missing
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # 6. Verify Android SDK
      - name: Verify Android SDK
        run: |
          set -e
          echo "Checking Android SDK..."
          sdkmanager --version
          adb version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # 7. Install dependencies
      - name: Install npm dependencies
        run: |
          set -e
          npm install --legacy-peer-deps --no-audit --no-fund

      # 8. Verify Capacitor
      - name: Verify Capacitor
        run: |
          node -e "console.log(require('./package.json').scripts)"
          npx cap --version

      # 9. Build web game
      - name: Build web game
        run: |
          set -e
          npm run build

      # 10. Add Android platform if missing
      - name: Add Android platform
        run: |
          set -e
          if [ ! -d android ]; then
            npx cap add android
          fi

      # 11. Sync Capacitor Android
      - name: Sync Capacitor
        run: |
          set -e
          npx cap sync android

      # 12. Build APK
      - name: Build SHERA RUN APK
        working-directory: android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 13. Verify APK
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated!"
            find android -name "*.apk"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 14. Upload APK
      - name: Upload SHERA RUN APK
        uses: actions/upload-artifact@v4
        with:
          name: SHERA-RUN-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
